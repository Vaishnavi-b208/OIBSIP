<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Issued Books - Digital Library</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #eef2ff, #f8fafc);
            color: #1e293b;
        }

        .header {
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            color: white;
            padding: 25px 45px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
        }

        .header h1 {
            font-size: 30px;
        }

        .back {
            background: white;
            color: #4f46e5;
            text-decoration: none;
            padding: 11px 20px;
            border-radius: 10px;
            font-weight: bold;
        }

        .container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .title {
            text-align: center;
            margin-bottom: 30px;
        }

        .title h2 {
            color: #312e81;
            font-size: 30px;
        }

        .title p {
            color: #64748b;
            margin-top: 8px;
        }

        .table-card {
            background: white;
            padding: 25px;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #4f46e5;
            color: white;
            padding: 14px;
            text-align: left;
        }

        td {
            padding: 14px;
            border-bottom: 1px solid #e2e8f0;
        }

        tr:hover {
            background: #f8fafc;
        }

        .status {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
        }

        .issued {
            background: #dcfce7;
            color: #166534;
        }

        .returned {
            background: #e0e7ff;
            color: #3730a3;
        }

        .empty {
            text-align: center;
            padding: 40px;
            color: #64748b;
        }

        @media (max-width: 750px) {
            .header {
                flex-direction: column;
                gap: 15px;
                text-align: center;
            }
        }
    </style>
</head>

<body>

<div class="header">

    <div>
        <h1>📚 Digital Library</h1>
    </div>

    <a href="/admin/dashboard" class="back">
        ← Dashboard
    </a>

</div>

<div class="container">

    <div class="title">
        <h2>📖 Issued Books</h2>
        <p>View all issued books, members and due dates.</p>
    </div>

    <div class="table-card">

        <table th:if="${issues != null and !issues.isEmpty()}">

            <thead>
            <tr>
                <th>ID</th>
                <th>Member</th>
                <th>Email</th>
                <th>Book</th>
                <th>Issue Date</th>
                <th>Due Date</th>
                <th>Return Date</th>
                <th>Status</th>
            </tr>
            </thead>

            <tbody>

            <tr th:each="issue : ${issues}">

                <td th:text="${issue.id}">1</td>

                <td th:text="${issue.user.name}">
                    Member
                </td>

                <td th:text="${issue.user.email}">
                    member@email.com
                </td>

                <td th:text="${issue.book.title}">
                    Book
                </td>

                <td th:text="${issue.issueDate}">
                    2026-09-21
                </td>

                <td th:text="${issue.dueDate}">
                    2026-10-05
                </td>

                <td th:text="${issue.returnDate != null ? issue.returnDate : 'Not Returned'}">
                    Not Returned
                </td>

                <td>

                    <span class="status issued"
                          th:if="${issue.status == 'ISSUED'}">
                        ISSUED
                    </span>

                    <span class="status returned"
                          th:if="${issue.status == 'RETURNED'}">
                        RETURNED
                    </span>

                </td>

            </tr>

            </tbody>

        </table>

        <div class="empty"
             th:if="${issues == null or issues.isEmpty()}">

            <h3>📚 No Issue Records</h3>
            <p>No books have been issued yet.</p>

        </div>

    </div>

</div>

</body>
</html>
