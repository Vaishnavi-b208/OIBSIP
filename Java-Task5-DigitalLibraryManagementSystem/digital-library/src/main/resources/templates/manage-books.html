<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Manage Books - Digital Library</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f7ff;
            color: #333;
        }

        .navbar {
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            color: white;
            padding: 18px 45px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
        }

        .nav-links {
            display: flex;
            gap: 10px;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            padding: 9px 15px;
            background: rgba(255,255,255,0.15);
            border-radius: 8px;
        }

        .container {
            max-width: 1200px;
            margin: auto;
            padding: 40px 25px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #4f46e5;
        }

        .add-btn {
            background: #16a34a;
            color: white;
            text-decoration: none;
            padding: 13px 20px;
            border-radius: 9px;
            font-weight: bold;
        }

        .add-btn:hover {
            background: #15803d;
        }

        .table-card {
            background: white;
            border-radius: 18px;
            padding: 25px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.08);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #4f46e5;
            color: white;
            padding: 15px;
            text-align: left;
        }

        td {
            padding: 14px;
            border-bottom: 1px solid #eee;
        }

        tr:hover {
            background: #f8f8ff;
        }

        .available {
            color: #16a34a;
            font-weight: bold;
        }

        .unavailable {
            color: #dc2626;
            font-weight: bold;
        }

        .edit-btn {
            background: #2563eb;
            color: white;
            text-decoration: none;
            padding: 7px 12px;
            border-radius: 6px;
        }

        .delete-btn {
            background: #dc2626;
            color: white;
            text-decoration: none;
            padding: 7px 12px;
            border-radius: 6px;
            margin-left: 5px;
        }

        .empty {
            text-align: center;
            padding: 40px;
            color: #777;
        }

    </style>

</head>

<body>

<nav class="navbar">

    <div class="logo">
        📚 Digital Library - Admin
    </div>

    <div class="nav-links">

        <a href="/admin/dashboard">
            Dashboard
        </a>

        <a href="/logout">
            Logout
        </a>

    </div>

</nav>


<div class="container">

    <div class="header">

        <h1>
            📚 Manage Books
        </h1>

        <a href="/admin/books/add"
           class="add-btn">

            ➕ Add New Book

        </a>

    </div>


    <div class="table-card">

        <table th:if="${not #lists.isEmpty(books)}">

            <thead>

            <tr>

                <th>ID</th>
                <th>Title</th>
                <th>Author</th>
                <th>ISBN</th>
                <th>Category</th>
                <th>Total</th>
                <th>Available</th>
                <th>Actions</th>

            </tr>

            </thead>

            <tbody>

            <tr th:each="book : ${books}">

                <td th:text="${book.id}">
                    1
                </td>

                <td th:text="${book.title}">
                    Java Programming
                </td>

                <td th:text="${book.author}">
                    Author
                </td>

                <td th:text="${book.isbn}">
                    ISBN
                </td>

                <td th:text="${book.category}">
                    Programming
                </td>

                <td th:text="${book.quantity}">
                    5
                </td>

                <td>

                    <span th:if="${book.availableQuantity > 0}"
                          class="available"
                          th:text="${book.availableQuantity}">
                        5
                    </span>

                    <span th:unless="${book.availableQuantity > 0}"
                          class="unavailable">
                        0
                    </span>

                </td>

                <td>

                    <a th:href="@{/admin/books/edit/{id}(id=${book.id})}"
                       class="edit-btn">
                        Edit
                    </a>

                    <a th:href="@{/admin/books/delete/{id}(id=${book.id})}"
                       class="delete-btn"
                       onclick="return confirm('Are you sure you want to delete this book?');">
                        Delete
                    </a>

                </td>

            </tr>

            </tbody>

        </table>


        <div class="empty"
             th:if="${#lists.isEmpty(books)}">

            <h2>
                📚 No Books Added Yet
            </h2>

            <p>
                Click "Add New Book" to add the first book.
            </p>

        </div>

    </div>

</div>

</body>

</html>
