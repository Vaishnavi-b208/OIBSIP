<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Profile - Digital Library</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        .container {
            width: 100%;
            max-width: 850px;
        }

        .card {
            background: white;
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .icon {
            width: 90px;
            height: 90px;
            margin: 0 auto 15px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 42px;
            color: white;
        }

        h1 {
            color: #333;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #777;
            font-size: 15px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 22px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .full {
            grid-column: 1 / -1;
        }

        label {
            font-weight: bold;
            color: #444;
            margin-bottom: 8px;
        }

        input {
            padding: 14px 16px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
            transition: 0.3s;
        }

        input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.15);
        }

        input[readonly] {
            background: #f5f5f5;
            color: #666;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 30px;
            flex-wrap: wrap;
        }

        .btn {
            text-decoration: none;
            border: none;
            padding: 13px 25px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-update {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }

        .btn-update:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.35);
        }

        .btn-back {
            background: #eeeeee;
            color: #444;
        }

        .btn-back:hover {
            background: #dddddd;
        }

        .message {
            margin-bottom: 20px;
            padding: 14px;
            border-radius: 10px;
            text-align: center;
            font-weight: bold;
        }

        .success {
            background: #d4edda;
            color: #155724;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
        }

        @media (max-width: 650px) {
            .form-grid {
                grid-template-columns: 1fr;
            }

            .full {
                grid-column: auto;
            }

            .card {
                padding: 25px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="card">

        <div class="header">
            <div class="icon">👤</div>

            <h1>My Profile</h1>

            <p class="subtitle">
                Manage your Digital Library account
            </p>
        </div>

        <!-- Success Message -->
        <div th:if="${success}"
             class="message success"
             th:text="${success}">
        </div>

        <!-- Error Message -->
        <div th:if="${error}"
             class="message error"
             th:text="${error}">
        </div>

        <form th:action="@{/user/profile/update}"
              method="post">

            <div class="form-grid">

                <div class="form-group">
                    <label for="name">Full Name</label>

                    <input type="text"
                           id="name"
                           name="name"
                           th:value="${user.name}"
                           required>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>

                    <input type="email"
                           id="email"
                           name="email"
                           th:value="${user.email}"
                           required>
                </div>

                <div class="form-group full">
                    <label for="password">
                        Password
                    </label>

                    <input type="password"
                           id="password"
                           name="password"
                           placeholder="Enter new password"
                           required>
                </div>

                <div class="form-group full">
                    <label for="role">Account Role</label>

                    <input type="text"
                           id="role"
                           th:value="${user.role}"
                           readonly>
                </div>

            </div>

            <div class="buttons">

                <button type="submit"
                        class="btn btn-update">
                    Update Profile
                </button>

                <a th:href="@{/user/dashboard}"
                   class="btn btn-back">
                    Back to Dashboard
                </a>

            </div>

        </form>

    </div>

</div>

</body>
</html>
