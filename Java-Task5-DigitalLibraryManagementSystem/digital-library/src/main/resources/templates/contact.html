<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact - Digital Library</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #eef2ff, #f8f9ff);
            color: #1f2937;
        }

        .navbar {
            background: linear-gradient(90deg, #4f46e5, #7c3aed);
            color: white;
            padding: 20px 55px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }

        .logo {
            font-size: 27px;
            font-weight: bold;
        }

        .nav-links {
            display: flex;
            gap: 12px;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            padding: 11px 18px;
            border-radius: 9px;
            background: rgba(255,255,255,0.15);
        }

        .nav-links a:hover {
            background: rgba(255,255,255,0.28);
        }

        .container {
            width: 90%;
            max-width: 850px;
            margin: 55px auto;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 38px;
            color: #3730a3;
            margin-bottom: 10px;
        }

        .header p {
            color: #64748b;
            font-size: 17px;
        }

        .card {
            background: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.10);
        }

        .user-info {
            background: #eef2ff;
            border-left: 5px solid #6366f1;
            padding: 16px;
            border-radius: 10px;
            margin-bottom: 25px;
        }

        .user-info strong {
            color: #4338ca;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #374151;
        }

        input,
        textarea {
            width: 100%;
            padding: 13px;
            border: 1px solid #d1d5db;
            border-radius: 9px;
            font-size: 15px;
            outline: none;
        }

        input:focus,
        textarea:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99,102,241,0.12);
        }

        textarea {
            min-height: 150px;
            resize: vertical;
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(90deg, #4f46e5, #7c3aed);
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        .submit-btn:hover {
            opacity: 0.92;
        }

        .success {
            background: #dcfce7;
            color: #166534;
            padding: 14px;
            border-radius: 9px;
            margin-bottom: 20px;
            text-align: center;
            font-weight: bold;
        }

        .footer {
            text-align: center;
            color: #64748b;
            margin: 40px 0 25px;
        }
    </style>
</head>

<body>

<div class="navbar">

    <div class="logo">
        📚 Digital Library
    </div>

    <div class="nav-links">
        <a href="/user/dashboard">Dashboard</a>
        <a href="/books">Browse Books</a>
        <a href="/user/my-books">My Books</a>
        <a href="/user/reservations">Reservations</a>
        <a href="/logout">Logout</a>
    </div>

</div>

<div class="container">

    <div class="header">
        <h1>💬 Contact Library</h1>
        <p>Submit your question or query to the library administrator.</p>
    </div>

    <div class="card">

        <div class="success"
             th:if="${param.success}">
            ✅ Your query has been submitted successfully!
        </div>

        <div class="user-info" th:if="${user != null}">
            👤 Logged in as:
            <strong th:text="${user.name}">User</strong>
            &nbsp; | &nbsp;
            📧 <span th:text="${user.email}">email</span>
        </div>

        <form th:action="@{/contact}"
              th:object="${query}"
              method="post">

            <div class="form-group">
                <label for="subject">Subject</label>

                <input type="text"
                       id="subject"
                       th:field="*{subject}"
                       placeholder="Enter your query subject"
                       required>
            </div>

            <div class="form-group">
                <label for="message">Message</label>

                <textarea id="message"
                          th:field="*{message}"
                          placeholder="Write your question or message..."
                          required></textarea>
            </div>

            <button type="submit"
                    class="submit-btn">
                📩 Submit Query
            </button>

        </form>

    </div>

</div>

<div class="footer">
    © 2026 Digital Library Management System
</div>

</body>
</html>
