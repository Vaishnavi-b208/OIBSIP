<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Book - Digital Library</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #eef2ff, #f5f3ff, #ecfeff);
            color: #1e293b;
        }

        .navbar {
            height: 70px;
            background: linear-gradient(90deg, #4f46e5, #7c3aed);
            color: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 40px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }

        .logo {
            font-size: 23px;
            font-weight: bold;
        }

        .nav-links {
            display: flex;
            gap: 15px;
        }

        .nav-links a {
            text-decoration: none;
            color: white;
            padding: 10px 18px;
            border-radius: 8px;
            transition: 0.3s;
        }

        .nav-links a:hover {
            background: rgba(255,255,255,0.18);
        }

        .container {
            width: 90%;
            max-width: 850px;
            margin: 45px auto;
        }

        .heading {
            text-align: center;
            margin-bottom: 30px;
        }

        .heading h1 {
            color: #312e81;
            font-size: 34px;
            margin-bottom: 8px;
        }

        .heading p {
            color: #64748b;
            font-size: 15px;
        }

        .card {
            background: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 12px 35px rgba(79,70,229,0.12);
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 22px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group.full {
            grid-column: 1 / -1;
        }

        label {
            margin-bottom: 8px;
            font-weight: bold;
            color: #334155;
        }

        input,
        select {
            padding: 13px 15px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
            transition: 0.3s;
        }

        input:focus,
        select:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99,102,241,0.12);
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 30px;
        }

        .btn {
            border: none;
            padding: 13px 28px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            transition: 0.3s;
        }

        .save-btn {
            background: linear-gradient(90deg, #4f46e5, #7c3aed);
            color: white;
        }

        .save-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 7px 18px rgba(79,70,229,0.3);
        }

        .cancel-btn {
            background: #e2e8f0;
            color: #334155;
        }

        .cancel-btn:hover {
            background: #cbd5e1;
        }

        .info {
            margin-top: 25px;
            padding: 15px;
            background: #eef2ff;
            border-left: 4px solid #6366f1;
            border-radius: 8px;
            color: #4338ca;
            font-size: 14px;
        }

        @media (max-width: 700px) {
            .navbar {
                padding: 0 18px;
            }

            .nav-links {
                gap: 5px;
            }

            .nav-links a {
                padding: 8px 10px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .form-group.full {
                grid-column: auto;
            }

            .card {
                padding: 22px;
            }
        }
    </style>
</head>

<body>

<nav class="navbar">
    <div class="logo">📚 Digital Library</div>

    <div class="nav-links">
        <a href="/admin/dashboard">Dashboard</a>
        <a href="/admin/books">Manage Books</a>
        <a href="/logout">Logout</a>
    </div>
</nav>

<div class="container">

    <div class="heading">
        <h1>➕ Add New Book</h1>
        <p>Add a new book to the digital library collection.</p>
    </div>

    <div class="card">

        <form action="/admin/books/save" method="post">

            <div class="form-grid">

                <div class="form-group full">
                    <label for="title">Book Title</label>
                    <input
                        type="text"
                        id="title"
                        name="title"
                        placeholder="Enter book title"
                        required>
                </div>

                <div class="form-group">
                    <label for="author">Author</label>
                    <input
                        type="text"
                        id="author"
                        name="author"
                        placeholder="Enter author name"
                        required>
                </div>

                <div class="form-group">
                    <label for="isbn">ISBN</label>
                    <input
                        type="text"
                        id="isbn"
                        name="isbn"
                        placeholder="Enter ISBN number"
                        required>
                </div>

                <div class="form-group">
                    <label for="category">Category</label>

                    <select id="category" name="category" required>
                        <option value="">Select Category</option>
                        <option value="Programming">Programming</option>
                        <option value="Database">Database</option>
                        <option value="Web Development">Web Development</option>
                        <option value="Artificial Intelligence">Artificial Intelligence</option>
                        <option value="Data Science">Data Science</option>
                        <option value="Networking">Networking</option>
                        <option value="Computer Science">Computer Science</option>
                        <option value="General">General</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="quantity">Quantity</label>
                    <input
                        type="number"
                        id="quantity"
                        name="quantity"
                        min="1"
                        placeholder="Enter quantity"
                        required>
                </div>

            </div>

            <div class="info">
                ℹ️ When a new book is added, the available quantity will automatically
                be set equal to the total quantity.
            </div>

            <div class="buttons">

                <button type="submit" class="btn save-btn">
                    💾 Save Book
                </button>

                <a href="/admin/books" class="btn cancel-btn">
                    ✖ Cancel
                </a>

            </div>

        </form>

    </div>

</div>

</body>
</html>
