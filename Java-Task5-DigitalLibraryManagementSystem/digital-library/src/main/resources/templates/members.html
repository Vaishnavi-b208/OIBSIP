<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Library Members</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #eef2ff, #f8fafc);
            color: #1e293b;
        }

        .header {
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            color: white;
            padding: 25px 45px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 30px;
        }

        .back {
            background: white;
            color: #4f46e5;
            text-decoration: none;
            padding: 11px 20px;
            border-radius: 10px;
            font-weight: bold;
        }

        .container {
            max-width: 1100px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .title {
            text-align: center;
            margin-bottom: 30px;
        }

        .title h2 {
            color: #312e81;
            font-size: 30px;
        }

        .title p {
            color: #64748b;
            margin-top: 8px;
        }

        .table-card {
            background: white;
            border-radius: 18px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #4f46e5;
            color: white;
            padding: 15px;
            text-align: left;
        }

        td {
            padding: 15px;
            border-bottom: 1px solid #e2e8f0;
        }

        tr:hover {
            background: #f8fafc;
        }

        .role {
            background: #ede9fe;
            color: #6d28d9;
            padding: 6px 12px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 13px;
        }

        .empty {
            text-align: center;
            padding: 35px;
            color: #64748b;
        }

        @media (max-width: 700px) {
            .header {
                flex-direction: column;
                gap: 15px;
                text-align: center;
            }
        }
    </style>
</head>

<body>

<div class="header">

    <div>
        <h1>📚 Digital Library</h1>
    </div>

    <a href="/admin/dashboard" class="back">
        ← Dashboard
    </a>

</div>

<div class="container">

    <div class="title">
        <h2>👥 Registered Members</h2>
        <p>View all users registered in the digital library.</p>
    </div>

    <div class="table-card">

        <table th:if="${members != null and !members.isEmpty()}">

            <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Role</th>
            </tr>
            </thead>

            <tbody>

            <tr th:each="member : ${members}">

                <td th:text="${member.id}">1</td>

                <td th:text="${member.name}">
                    Member Name
                </td>

                <td th:text="${member.email}">
                    member@email.com
                </td>

                <td>
                    <span class="role"
                          th:text="${member.role}">
                        USER
                    </span>
                </td>

            </tr>

            </tbody>

        </table>

        <div class="empty"
             th:if="${members == null or members.isEmpty()}">

            <h3>No members found</h3>
            <p>No registered members are currently available.</p>

        </div>

    </div>

</div>

</body>
</html>
